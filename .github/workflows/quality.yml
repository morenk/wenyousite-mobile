name: Quality

on:
  # 第一阶段快速迭代期间不自动触发；需要阶段验收时由维护者手动执行。
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install tooling
        run: |
          npm ci
          flutter pub get

      - name: Validate and regenerate API
        run: |
          npm run api:validate
          npm run api:generate
          git diff --exit-code -- packages/wenyou_api

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze application
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Analyze generated API
        working-directory: packages/wenyou_api
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Check architecture boundaries
        run: npm run architecture:check

      - name: Run tests
        run: flutter test

      - name: Check module documentation
        run: npm run docs:check
