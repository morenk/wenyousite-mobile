name: Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install tooling
        run: |
          npm ci
          flutter pub get

      - name: Validate and regenerate API
        run: |
          npm run api:validate
          npm run api:generate
          git diff --exit-code -- packages/wenyou_api

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze application
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Analyze generated API
        working-directory: packages/wenyou_api
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Check module documentation
        run: npm run docs:check
