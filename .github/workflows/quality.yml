name: Quality

on:
  # 第一阶段快速迭代期间不自动触发；需要阶段验收时由维护者手动执行。
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install tooling
        run: |
          npm ci
          flutter pub get

      - name: Run the Windows mobile quality gate
        run: npm run check
